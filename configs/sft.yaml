# Phase 1: LoRA SFT on coding + persona conversations. Keys are Miles flags, see common.yaml.
train_args:
  # data
  rollout_function_path: miles.rollout.sft_rollout.generate_rollout
  loss_type: sft_loss
  input_key: messages
  prompt_data: /root/qwen_posttrain/data/sft.parquet
  disable_compute_advantages_and_returns: true
  debug_train_only: true

  # training
  actor_num_gpus_per_node: 2
  num_gpus_per_node: 2
  num_epoch: 3
  rollout_batch_size: 64
  global_batch_size: 64
  max_tokens_per_gpu: 8192
  save: /root/outputs/qwen_posttrain/sft
  save_interval: 50

  # optimizer
  lr: 1.0e-4
  lr_decay_style: cosine
  min_lr: 1.0e-6
  lr_warmup_fraction: 0.05
  weight_decay: 0.0
  adam_beta2: 0.95
